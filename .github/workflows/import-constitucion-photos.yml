name: Import Constitución photos

on:
  push:
    branches:
      - constitucion-photo-integration-use-this
    paths:
      - .github/workflows/import-constitucion-photos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: constitucion-photo-integration-use-this
      - name: Stop if already imported
        id: check
        run: |
          if [ -f public/assets/photos/constitucion/rocas-arco-constitucion.jpg ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download supplied photo pack
        if: steps.check.outputs.done != 'true'
        run: |
          curl -fL --retry 3 'https://at.adobe.com/3JDyxb8SeiRgrsYb' -o /tmp/constitucion.zip
          rm -rf /tmp/constitucion-src
          mkdir -p /tmp/constitucion-src public/assets/photos/constitucion
          unzip -q /tmp/constitucion.zip -d /tmp/constitucion-src
          find /tmp/constitucion-src -type f -maxdepth 4 -print
      - name: Preserve originals at native resolution
        if: steps.check.outputs.done != 'true'
        run: |
          ROOT="/tmp/constitucion-src/FOTOS PARA PAGINA TRANS DIGITAL"
          cp "$ROOT/itinerario-Rocas-de-constituci#U00f3n.jpg" public/assets/photos/constitucion/rocas-arco-constitucion.jpg
          cp "$ROOT/3ee8475f-whatsapp-image-2021-01-20-at-3.58.35-pm.jpeg" public/assets/photos/constitucion/municipalidad-diurna.jpg
          cp "$ROOT/images (2).jpg" public/assets/photos/constitucion/costa-rocas.jpg
          cp "$ROOT/images (4).jpg" public/assets/photos/constitucion/rio-puente-ciudad.jpg
          cp "$ROOT/images (3).jpg" public/assets/photos/constitucion/vista-aerea-borde-costero.jpg
          cp "$ROOT/images (1).jpg" public/assets/photos/constitucion/iglesia-constitucion.jpg
          cp "$ROOT/images.jpg" public/assets/photos/constitucion/municipalidad-nocturna.jpg
      - name: Commit photographs
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name 'Ruta Digital bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/photos/constitucion
          git commit -m 'assets: add Constitución photos at native resolution'
          git push origin HEAD:constitucion-photo-integration-use-this
