<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editor · Ruta Digital Constitución</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="toast"></div>
<section id="login" class="login"><form id="loginForm" class="loginCard"><span class="mark">RD</span><p class="kicker">Ruta Digital Constitución</p><h1>Editor de contenidos</h1><p>Acceso para el equipo responsable del portal.</p><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button><small id="loginMsg"></small></form></section>
<div id="app" class="app hidden"><aside class="side"><a class="sideBrand" href="/" target="_blank"><span>RD</span><div><strong>Ruta Digital</strong><small>Editor municipal</small></div></a><nav id="nav">
<button data-view="dashboard" class="active">Resumen</button><button data-view="site">Textos y portada</button><button data-view="capsules">Cápsulas</button><button data-view="notes">Notas</button><button data-view="videos">Videos</button><button data-view="materials">Material base</button><button data-view="news">Actualidad</button><button data-view="timeline">Hitos 2026</button><button data-view="resources">Biblioteca</button><button data-view="media">Archivos</button><button data-view="backup">Respaldo</button></nav><div class="sideFoot"><button id="openSite">↗ Ver portal</button><button id="logout">Salir</button></div></aside>
<main class="main"><header class="top"><div><p class="kicker" id="crumb">Panel editorial</p><h1 id="viewTitle">Resumen</h1></div><div class="topActions"><span id="saveState">Conectado</span><button id="newItem" class="primary hidden">+ Nuevo</button></div></header><section id="content" class="content"></section></main></div>
<dialog id="editor"><form method="dialog" class="editorHead"><div><p class="kicker" id="editorKicker">Editar contenido</p><h2 id="editorTitle">Contenido</h2></div><button value="cancel" class="icon">×</button></form><div id="editorBody" class="editorBody"></div><div class="editorFoot"><button id="cancelEditor">Cancelar</button><button id="saveEditor" class="primary">Guardar cambios</button></div></dialog>
<script src="/admin/admin.js" defer></script></body></html>
